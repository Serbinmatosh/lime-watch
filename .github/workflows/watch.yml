name: watch

on:
  workflow_dispatch: # Allows you to trigger the run manually from the GitHub Actions tab

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python runtime environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install required script dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Playwright needs the actual browser binaries and OS dependencies installed to run headless
          playwright install chromium --with-deps

      - name: Restore execution state file cache
        uses: actions/cache@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Execute stock tracking check
        run: python3 watch.py --loop 60 --duration 230
        env:
          CHAT_BOT_TOKEN: ${{ secrets.CHAT_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # Pass the cookie directly from GitHub Secrets to os.environ in your script
          SESSION_COOKIE: ${{ secrets.SESSION_COOKIE }}