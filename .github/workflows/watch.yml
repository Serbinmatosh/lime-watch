name: watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - run: python3 watch.py --loop 60 --duration 290
        env:
          CHAT_BOT_TOKEN: ${{ secrets.CHAT_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
